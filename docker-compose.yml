services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadpilot
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_SECRET: change-this-before-production
      APP_URL: http://localhost:8000
      DATABASE_URL: postgresql+psycopg2://leadpilot:leadpilot@db:5432/leadpilot
      ALLOW_SIGNUP: "true"
      DEMO_SEED: "true"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
